<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Alert</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>✈ Flight Alert</h1>

  <div class="muted">
    Know when aircraft are flying near your home
  </div>

  <div class="status">
    <div id="page-header">Checking for aircraft...</div>
    <div id="status-description" class="muted"></div>
    <div id="details"></div>
  </div>

  <div id="error" role="status"></div>

  <p class="muted" id="updated">
    Waiting for flight data...
  </p>

  <div class="settings">
    <h2>Your Preferences</h2>

    <div class="home-settings">
      <label class="home-label">
        Home location
      </label>

      <div class="home-coordinates">
        <div>
          <label for="home-latitude">Latitude</label>
          <input
            type="number"
            id="home-latitude"
            min="-90"
            max="90"
            step="any"
            placeholder="Latitude"
          >
        </div>

        <div>
          <label for="home-longitude">Longitude</label>
          <input
            type="number"
            id="home-longitude"
            min="-180"
            max="180"
            step="any"
            placeholder="Longitude"
          >
        </div>
      </div>

      <p class="settings-note">
        Enter the coordinates of the location you want to monitor.
      </p>

      <button id="save-home" type="button">
        Save location
      </button>
    </div>

    <div class="setting-row">
      <label for="detection-radius">
        How close to your home?
      </label>

      <strong id="radius-value">2 miles</strong>
    </div>

    <input
      type="range"
      id="detection-radius"
      min="1"
      max="20"
      step="1"
      value="2"
    >

    <div class="range-labels">
      <span>1 mi</span>
      <span>20 mi</span>
    </div>

    <p class="settings-note">
      We'll alert you when an aircraft is expected
      to fly within this distance of your home.
    </p>

    <div id="settings-status" role="status"></div>
  </div>

  <button id="refresh" type="button">
    Check for aircraft
  </button>

  <script src="config.js"></script>
  <script src="app.js"></script>
  
</body>
</html>
