<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Alert</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 310px;
      padding: 16px;
      margin: 0;
      color: #202124;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 6px;
    }

    .muted {
      color: #666;
      font-size: 12px;
    }

    .status {
      margin: 14px 0;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .metric:last-child {
      border-bottom: 0;
    }

    .value {
      font-weight: 600;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #error {
      color: #b91c1c;
      white-space: normal;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h1>✈ Flight Alert</h1>
  <div class="muted">Aircraft approaching your home</div>

  <div class="status">
    <div id="page-header">Checking OpenSky...</div>
    <div id="details"></div>
  </div>

  <div id="error" role="status"></div>
  <p class="muted" id="updated">Waiting for data...</p>

  <button id="refresh" type="button">
    Refresh aircraft
  </button>

  <script src="app.js"></script>
</body>
</html>
